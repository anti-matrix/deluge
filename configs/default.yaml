# Deluge default configuration. Every tunable number lives here (spec rule 5).
# Sections are added round by round as systems start using them; the loader
# rejects unknown and missing keys.

run:
  world_seed: 1             # the map (the "world" stream)
  history_seed: 1           # everything else: climate noise, shocks, founders, demography, Mesa
  years: 12900              # one step = one year; year 0 = the Younger Dryas analogue, year 12,900 = the present

rng:
  # Named child streams of the run's single root seed, one per system.
  # Each stream is keyed by its name, so adding or reordering streams never
  # shifts the numbers another stream produces. "mesa" feeds Mesa's own
  # model.rng / model.random (agent shuffling, grid random selection).
  streams:
    - mesa
    - world
    - climate
    - shocks
    - capacity
    - demography
    - migration
    - knowledge
    - teachers
    - brains
    - war
    - politics
    - memory
    - founders
    - identity

grid:
  width: 160
  height: 96
  torus: false

world:
  source: procedural          # procedural | earth (earth: round 12)
  lat_south: -60.0            # latitude of row 0, degrees
  lat_north: 70.0             # latitude of the last row
  km_per_degree: 111.2        # sets the cell size: (lat span * km_per_degree) / rows
  land_share: 0.35            # share of cells above the reference sea level
  reference_sea_level_m: -60.0  # land share is calibrated at this level (year-0 level of the default curve)
  max_attempts: 80            # world draws tried until the geography rules below hold

  landmasses:                 # counted at the year-0 sea level
    min_count: 3
    max_count: 5
    min_share_of_land: 0.03   # smaller connected land areas count as islands
    min_size_ratio: 1.5       # largest / smallest landmass, so sizes are uneven
    min_islands: 3

  seas:                       # at least one inland sea or semi-enclosed sea
    required: true
    open_water_min_steps: 2   # open water: sea cells at least this many steps from land
    min_basin_cells: 15       # a separate open-water basin, or an inland sea, at least this big (15 cells ~ Black Sea)

  land_bridges:               # a land connection that drowns during a sea-level pulse
    min_count: 1
    min_share_of_land: 0.03   # both sides of the bridge must be at least this share of year-0 land
    pulse_rate_factor: 2.0    # pulse years: sea rises faster than this times the mean rise rate
    construct_if_missing: true  # if no natural bridge drowns in a pulse, raise one between two nearby landmasses
    max_length_steps: 8       # longest constructed bridge, in hex steps
    crest_margin_m: 2.0       # crest kept this far inside the pulse's sea-level span
    end_rise_m_per_step: 4.0  # bridge rises from its crest toward both shores
    flank_floor_m: -110.0     # sea cells beside a constructed bridge are raised to at least this depth

  shape:                      # continent mask: warped multi-octave noise plus plate bias
    base_frequency: 1.4       # cycles per map width
    octaves: 7
    persistence: 0.55         # high-frequency energy for ragged coasts
    lacunarity: 2.0
    warp_frequency: 1.2
    warp_octaves: 4
    warp_persistence: 0.5
    warp_lacunarity: 2.0
    warp_strength: 0.18       # fraction of map width
    plate_bias_weight: 0.22   # how strongly continental plates favour land
    plate_bias_smoothing_passes: 40
    edge_falloff_width: 0.07  # fraction of width over which relief drops toward the east and west edges
    pole_falloff_deg: 7.0   # how far land spreads poleward: relief drops over this many degrees before the north and south edges
    edge_falloff_weight: 1.2
    edge_sea_cells: 3         # cells this close to the map border are always open sea

  tectonics:                  # heights are in normalized relief units: 1 = the median land cell above the coast
    enabled: true
    plates_min: 6
    plates_max: 12
    noise_persistence: 0.5         # for the boundary warp and peak noise
    noise_lacunarity: 2.0
    boundary_warp_frequency: 3.0
    boundary_warp_octaves: 4
    boundary_warp_strength: 0.2    # fraction of map width; makes plate boundaries curve
    speed_min: 0.3
    speed_max: 1.0
    convergence_threshold: 0.25    # boundary is convergent above this, divergent below minus this
    mountain_height: 6.0           # at a fully convergent boundary
    mountain_width_km: 380
    peak_noise_frequency: 7.0      # breaks ranges into peaks and passes
    peak_noise_octaves: 3
    peak_noise_sharpness: 2.0      # ridged profile (1 - |noise|) ** sharpness
    peak_noise_weight: 0.8
    plateau_height: 1.6            # on the overriding side, behind the range
    plateau_width_km: 700
    plateau_falloff_km: 350
    rift_depth: 2.0                # narrow rift valley at divergent boundaries
    rift_width_km: 220
    basin_depth: 0.7               # broad lowland basin around the rift
    basin_width_km: 700

  elevation:
    # Continuous hypsometric curve. Relief z is normalized so z = 0 is the year-0
    # coast and z = 1 (land) / -1 (sea) is the median land / sea cell; metres are
    # interpolated between knots [z, metres].
    land_knots:
      - [0.0, -60.0]
      - [0.45, 0.0]
      - [1.0, 140.0]
      - [1.8, 380.0]
      - [2.6, 800.0]
      - [3.6, 1600.0]
      - [5.0, 2800.0]
      - [7.0, 4300.0]
      - [10.0, 5800.0]
    sea_knots:
      - [0.0, -60.0]
      - [-0.35, -120.0]
      - [-0.5, -600.0]
      - [-0.8, -3000.0]
      - [-1.5, -4600.0]
      - [-4.0, -6000.0]
    detail_m: 30.0            # small-scale relief on land: amplitude = detail_m + detail_fraction * height
    detail_fraction: 0.25
    detail_frequency: 32.0    # cycles per map width
    detail_octaves: 3
    detail_persistence: 0.5
    detail_lacunarity: 2.0

  erosion:                    # light particle (droplet) pass, units are metres
    droplets: 30000
    max_steps: 60
    direction_exponent: 2.0   # next cell drawn among lower neighbours with weight drop ** exponent
    capacity_factor: 0.5      # sediment capacity per metre of drop
    erode_rate: 0.1
    deposit_rate: 0.3
    max_erode_fraction: 0.5   # never cut more than this share of the drop to the next cell

  fill_epsilon_m: 0.05        # depression filling: minimum drop along a flow path across flats
  fill_random_factor: 30.0    # raised cells get epsilon * (1 + factor * U): drainage wanders across flats

  temperature:
    equator_c: 27.0
    pole_c: -25.0
    lat_exponent: 1.3         # T = equator + (pole - equator) * (|lat| / 90) ** exponent
    lapse_rate_c_per_km: 6.5
    continentality_neutral_c: 10.0   # interiors move away from this: warm places warmer, cold colder
    continentality_amplitude: 0.3    # at full continentality, deviation from neutral grows by this share
    continentality_scale_km: 1200.0  # distance from the sea for continentality to reach 63%

  rainfall:
    base_mm: 380.0
    bands:                    # [latitude, amplitude mm, width degrees], gaussian bumps
      - [0.0, 1800.0, 16.0]
    winds:                    # [lat_min, lat_max, u (east+), v (north+)]: direction air moves; westerlies below fill the gap
      - [-90.0, -60.0, -1.0, 0.3]
      - [-35.0, 0.0, -1.0, 0.35]
      - [0.0, 35.0, -1.0, -0.35]
      - [60.0, 90.0, -1.0, -0.3]
    westerlies:               # mid-latitude storm tracks, both hemispheres
      lat_min: 35.0           # |latitude| band
      lat_max: 60.0
      u: 1.0                  # eastward
      v_poleward: 0.3         # drift toward the pole
      rain_mm: 900.0          # added rain inside the band
      edge_deg: 8.0           # rain and moisture carriage ramp in over this many degrees inside each band edge
      land_loss_factor: 0.4   # storms carry moisture further inland: land loss scaled by this in the band
    wind_sharpness: 2.0       # weight of upwind neighbours ~ cos(angle) ** sharpness
    noise_octaves: 3          # for band wobble, wind turning and rain noise
    noise_persistence: 0.5
    noise_lacunarity: 2.0
    band_wobble_deg: 7.0      # low-frequency noise shifts the latitude bands by up to this
    band_wobble_frequency: 1.5
    wind_angle_noise_deg: 25.0
    wind_noise_frequency: 2.0
    rain_noise_amplitude: 0.25    # multiplicative low-frequency noise, exp(amp * noise)
    rain_noise_frequency: 2.5
    upwind_moisture: 1.0      # air entering from the map edge or over sea
    land_loss_per_1000km: 0.08 # share of moisture rained out per 1000 km over land
    orographic_gain_per_km: 1.2   # windward rain boost per km of uplift
    shadow_loss_per_km: 0.9       # moisture lost per km of uplift (rain shadow behind)
    shadow_min_uplift_m: 100.0    # rises smaller than this per step cast no shadow: only real barriers dry the air
    orographic_smoothing_passes: 3  # lift and shadow use relief smoothed this many times
    min_moisture: 0.05
    continentality_weight: 0.15   # extra drying with distance from any sea
    continentality_scale_km: 1500.0
    iterations: 220           # moisture transport sweeps (longer than any land crossing)
    smoothing_passes: 1

  rivers:
    et_base_mm: 100.0         # evapotranspiration: runoff = max(rain - (base + per_c * max(T, 0)), 0)
    et_per_c_mm: 16.0
    min_flow: 3.6             # drainage (land cells x metres/year of runoff) for a river; ~88.8th percentile of land on world seed 1, ~600 river cells
    direction_exponent: 1.0   # each cell drains to a lower neighbour drawn with weight drop ** exponent

  terrain:
    mountain_m: 2000.0
    hills_m: 800.0
    ice_c: -12.0              # base temperature below this: ice
    tundra_c: -4.0            # below this (and not ice): tundra
    desert_rain_mm: 80.0      # dryness thresholds grow with temperature (Whittaker-style)
    desert_rain_per_c: 7.0
    steppe_rain_mm: 200.0
    steppe_rain_per_c: 12.0
    forest_rain_mm: 400.0
    forest_rain_per_c: 24.0
    wetland_max_m_above_sea: 30.0
    wetland_min_flow: 20.0
    wetland_min_rain_mm: 1800.0

  fertility:
    base:                     # per terrain
      sea: 0.0
      plain: 0.65
      forest: 0.5
      hills: 0.35
      mountain: 0.05
      desert: 0.05
      steppe: 0.4
      wetland: 0.6
      tundra: 0.05
      ice: 0.0
    river_bonus: 0.35         # scaled by log flow up to river_flow_ref
    river_flow_ref: 100.0
    sediment_bonus: 0.15      # on cells where erosion deposited sediment
    sediment_ref_m: 20.0
    cold_zero_c: -6.0         # fertility factor ramps from 0 at this temperature
    cold_full_c: 8.0          # to 1 at this one

  wild_food:
    base:
      sea: 0.0
      plain: 0.5
      forest: 0.55
      hills: 0.4
      mountain: 0.12
      desert: 0.05
      steppe: 0.35
      wetland: 0.8
      tundra: 0.15
      ice: 0.0
    forest_edge_bonus: 0.2    # forest next to open land, and open land next to forest
    river_bonus: 0.1
    cold_zero_c: -18.0
    cold_full_c: 4.0
    cold_floor: 0.15          # cold factor never drops below this

  minerals:                   # deposits on land cells (ever land: above the year-0 sea), spec section 5
    # Each cell's score for a mineral is the weighted mean of these terms, times a clustered noise
    # factor; the top ``share`` of ever-land cells by score hold a deposit, with an abundance
    # drawn uniformly in [abundance_min, abundance_max].
    #   belt      near a convergent plate boundary: exp(-distance / belt_km)  (mountain belts)
    #   upland    height above present sea level, 0 at 0 m, 1 at upland_m and up
    #   lowland   1 at present sea level, 0 at lowland_m and up (0 below present sea level)
    #   stable    away from convergent boundaries: 1 - belt term (old basins)
    #   sediment  sediment laid down by erosion, 1 at sediment_ref_m and up (above present sea level)
    #   shelf     below present sea level: land at year 0 that the sea takes (continental shelf)
    belt_km: 500.0
    upland_m: 800.0
    lowland_m: 300.0
    sediment_ref_m: 10.0
    noise_frequency: 6.0      # cycles per map width: deposits cluster into fields and districts
    noise_octaves: 2
    noise_persistence: 0.5
    noise_lacunarity: 2.0
    noise_weight: 0.5         # score x (1 - weight + weight * noise in 0..1)
    # Access (spec section 5: on the cell, polity control, or trade). A settlement has access to a
    # deposit within this many hex steps of its cell (the stand-in for local reach and trade until
    # trade exists; it works the nearest one), or to one in its polity's territory
    # (polities.territory_radius). Each mineral a technique needs is looked up on its own.
    access_radius_cells: 4
    depletion: false          # deposits do not deplete by default (spec section 5)
    depletion_per_settlement_year: 0.002  # with depletion on: abundance lost per year per settlement working the deposit
    types:
      copper:   {share: 0.03, belt: 1.0, upland: 0.5, lowland: 0.0, stable: 0.0, sediment: 0.0, shelf: 0.0, abundance_min: 0.2, abundance_max: 1.0}
      tin:      {share: 0.012, belt: 1.0, upland: 0.7, lowland: 0.0, stable: 0.0, sediment: 0.0, shelf: 0.0, abundance_min: 0.2, abundance_max: 1.0}
      iron_ore: {share: 0.05, belt: 0.6, upland: 0.4, lowland: 0.0, stable: 0.3, sediment: 0.0, shelf: 0.0, abundance_min: 0.2, abundance_max: 1.0}
      coal:     {share: 0.04, belt: 0.0, upland: 0.0, lowland: 1.0, stable: 0.8, sediment: 0.6, shelf: 0.0, abundance_min: 0.2, abundance_max: 1.0}
      oil:      {share: 0.03, belt: 0.0, upland: 0.0, lowland: 0.6, stable: 0.4, sediment: 0.8, shelf: 0.3, abundance_min: 0.2, abundance_max: 1.0}

climate:
  sea_level:
    preset: default
    presets:                  # piecewise-linear [year, metres relative to present]
      default:
        - [0, -60.0]
        - [500, -55.0]
        - [700, -40.0]        # first fast pulse
        - [1500, -31.0]
        - [1750, -13.0]       # second fast pulse
        - [3000, 0.0]
        - [12900, 0.0]
      modern_melt:            # same pulse structure, 0 m to +70 m
        - [0, 0.0]
        - [500, 5.83]
        - [700, 23.33]
        - [1500, 33.83]
        - [1750, 54.83]
        - [3000, 70.0]
        - [12900, 70.0]

  temperature:                # global anomaly, degC, added to world base_temp
    cold_snap_start: 0
    cold_snap_end: 1200
    cold_snap_depth_min: -5.0
    cold_snap_depth_max: -3.0
    cold_snap_ramp_years: 200   # recovery after the end
    optimum_start: 3000
    optimum_end: 7500           # Holocene optimum analogue, years 3,000-7,500
    optimum_peak: 1.0
    optimum_ramp_years: 500
    late_cooling_end_year: 12900  # slow linear cooling from optimum_end to this year (the present), flat after
    late_cooling_end_value: -0.6
    # Short spells added on top of the cooling trend (medieval warm period and Little Ice
    # Age analogues); each ramps in and out over spell_ramp_years inside its window.
    warm_spell_start: 11900
    warm_spell_end: 12200
    warm_spell_offset: 0.4
    cold_spell_start: 12200
    cold_spell_end: 12800
    cold_spell_offset: -0.5
    spell_ramp_years: 50
    red_noise_phi: 0.97         # AR(1) coefficient, decades-long swings
    red_noise_sigma: 0.08

  shocks:
    drought_annual_probability: 0.06
    drought_duration_min: 2
    drought_duration_max: 30
    drought_radius_min_km: 400.0
    drought_radius_max_km: 1600.0
    drought_rain_factor_min: 0.35
    drought_rain_factor_max: 0.8
    volcanic_annual_probability: 0.002
    volcanic_duration_min: 1
    volcanic_duration_max: 5
    volcanic_temp_drop_min: -2.5
    volcanic_temp_drop_max: -0.5

capacity:                     # densities are people per km2; cell area comes from the grid geometry
  forage:
    min_density: 0.1
    max_density: 1.0
    density_scale: 0.11       # calibration (Round 3): year-0 foraging capacity of world seed 1 from 68.8 M to ~7.6 M; see docs/ROUND12_NOTES.md
    coast_bonus: 0.2          # added to wild food on cells next to the year's sea
    temp_zero_c: -20.0
    temp_full_c: 0.0
    rain_zero_mm: 50.0
    rain_full_mm: 400.0
    terrain:
      sea: 0.0
      plain: 1.0
      forest: 1.0
      hills: 1.0
      mountain: 0.6
      desert: 1.0
      steppe: 1.0
      wetland: 1.0
      tundra: 0.3
      ice: 0.0
  herd:
    min_density: 0.5
    max_density: 3.0
    density_scale: 0.3        # calibration (Round 4): see docs/ROUND12_NOTES.md
    temp_zero_c: -12.0
    temp_full_c: 2.0
    rain_zero_mm: 100.0
    rain_full_mm: 350.0
    terrain:
      sea: 0.0
      plain: 0.8
      forest: 0.2
      hills: 0.8
      mountain: 0.2
      desert: 0.15
      steppe: 1.0
      wetland: 0.3
      tundra: 0.3
      ice: 0.0
  farm:
    min_density: 10.0
    max_density: 50.0
    density_scale: 0.21       # calibration (Round 4; 0.3 -> 0.25 -> 0.21 in tuning): see docs/ROUND12_NOTES.md
    temp_zero_c: 2.0
    temp_full_c: 12.0
    rain_zero_mm: 250.0
    rain_full_mm: 600.0
    river_water_mm_per_flow: 40.0   # river cells count flow as extra water
    terrain:
      sea: 0.0
      plain: 1.0
      forest: 0.4
      hills: 0.4
      mountain: 0.0
      desert: 0.3
      steppe: 0.5
      wetland: 0.5
      tundra: 0.0
      ice: 0.0

founders:                     # the five founding forager groups, placed at year 0 from history_seed
  names: [A, B, C, D, E]
  population_min: 100
  population_max: 250
  capacity_top_share: 0.3333  # each starts on a land cell in the top third of year-0 foraging capacity
  min_distance_cells: 25      # hex steps between any two groups
  min_landmasses: 2           # groups spread over at least this many landmasses
  max_attempts: 2000          # placement draws before giving up
  pinned_cells: []            # [[col, row], ...] one per group to pin placement; empty = draw
  culture_traits: [hierarchy, militarism, openness, kin_vs_civic, ritual_investment, mobility_preference]
  culture_min: 0.0            # each group's traits are drawn uniformly in [min, max] (history_seed)
  culture_max: 1.0

demography:                   # food in rations (one person-year of food)
  forage_abundance: 2.0       # rations a worker gathers per year where food is not limiting, per mode
  herd_abundance: 1.8
  farm_abundance: 1.6         # farming is more work per ration than foraging, but supports far more people per cell
  forage_max_growth: 0.003    # net growth per year at full food, per mode (spec: ~0.3% foragers, ~1% farmers)
  herd_max_growth: 0.006
  farm_max_growth: 0.01
  mode_shift_rate: 0.05       # share of people moved per year toward the mode that promises faster growth
  mode_brain_bias: 0.0005     # the polity brain's farming / herding outputs add bias x (output - 0.5) to the expected
                              # growth of a shift toward that mode (Round 7): an influence, not a command (one shift
                              # step changes expected growth by up to ~mode_shift_rate x farm_max_growth = 0.0005)
  farm_stickiness: 0.2        # shifting away from farming runs at this fraction of mode_shift_rate
  famine_mortality: 1.0       # share of people dying per unit of ration shortfall
  famine_max_mortality: 0.5   # cap on the yearly famine death share
  demographic_turnover: 0.07  # births + deaths per person-year: random fluctuation, larger in small groups
  store_cap_years: 0.1        # foragers store at most this many years of food
  spoilage: 0.5               # share of the store lost per year
  min_population: 10          # settlements below this dissolve
  wild_food_degrade: 0.05     # forage health lost per year per unit of overuse (people / capacity - 1)
  wild_food_recover: 0.02     # share of the lost health regained per year
  wild_food_floor: 0.3

migration:
  split_threshold: 0.5        # a band splits once it reaches this share of its cell's capacity (Round 3 tuning: 0.75 -> 0.5),
  split_threshold_range: 0.5  # + range x (0.5 - its polity brain's expand output) (Round 7): 0.25 .. 0.75
  split_fraction: 0.4         # share of people who leave to found the daughter settlement
  split_retry_years: 25       # wait before a band that found no place tries again
  search_radius: 3            # hex steps searched for a new cell (same landmass)
  distance_cost: 0.1          # utility lost per hex step
  crowding_cost: 0.05         # utility lost per occupied neighbouring cell
  min_found_food_ratio: 1.0   # a cell is only settled if expected food per head there is at least this
  famine_move_ratio: 0.9      # a band moves whole when its food per head falls below this
  sedentary_farm_share: 0.5   # bands farming at least this share are sedentary:
  farmer_famine_years: 3      # they move only after this many famine years in a row (spec section 6)
  core_move_rate: 0.05        # per year, chance x the brain's core migration output that a polity's capital band
                              # (not sedentary) moves whole to a better free cell in reach (Round 7)

knowledge:                    # spec section 7; the graph itself is a data file
  graph_file: knowledge.yaml  # relative to this config file
  late_techniques_enabled: false  # techniques marked late (after iron) can be invented and diffused only when true;
                                  # off until calibrated (industry arrived by year 2,902 in Round 4b; docs/ROUND12_NOTES.md)
  invention_scale: 2.0e-6     # inventions per settlement-year at the reference population, times the technique's invention_rate
  invention_reference_population: 1000
  invention_population_exponent: 1.0
  division_of_labor_invention_bonus: 1.0  # with division of labor known, invention odds x (1 + bonus)
  diffusion_rate: 0.02        # chance per year per adjacent settlement that knows it, times the receiver's openness
  use_share: 0.1              # a mode technique counts as used when at least this share of people work that mode
  size_use_population: 5000   # techniques used_with "size" count as used at this population and up
  decay_unused: 0.003         # strength lost per year while usable but unused (~330 years; Round 4 tuning: 0.01 -> 0.003)
  decay_latent: 0.0002        # strength lost per year while latent (held where it cannot be used); none while a neighbour practises it
  decay_small: 0.002          # extra loss per year per unit of (small_reference_population / population - 1), used or not
  small_reference_population: 500
  small_factor_cap: 50.0
  practice_gain: 0.1          # strength regained per year while in use (capped at 1)
  crash_share: 0.5            # reporting: a loss counts as after a crash when population < this share of the settlement's peak

teachers:                     # spec section 7: contact phase only, then removed
  enabled: true
  arrival_year: 0
  first_group: -1             # index into founders.names; -1 draws it from history_seed
  years_per_group: 10         # 5 groups x 10 years = the default 50-year stay
  knowledge: [agriculture, storage, sedentary_building, division_of_labor, megalithic_construction, sky_calendar]
  teach_rate: 0.5             # chance per technique per contact year, times the group's openness (Round 4 tuning: 0.15 -> 0.5)
  technologies: [flight, weapons, tools, medicine]  # what the groups can witness; flight on every arrival and departure
  artifact_chance: 0.3        # per group, when the teachers leave it
  artifacts_min: 1
  artifacts_max: 4
  artifact_types: [tools, medicine, weapons]
  artifact_lifespan_min: 30
  artifact_lifespan_max: 300
  tools_production: 1.1       # production multiplier while a tools artifact lasts
  medicine_famine_mortality: 0.5  # famine deaths multiplied by this while a medicine artifact lasts
  weapons_military: 2.0       # military multiplier (war from Round 6)

events:                       # raw event log (spec sections 11 and 12); logged at or above min_magnitude
  min_magnitude:
    arrived: 0.0
    taught: 0.0
    displayed: 0.0
    departed: 0.0
    gave: 0.0
    used: 0.0                 # an artifact used; a settlement starting to work a mineral deposit (people)
    broke: 0.0
    fought: 0.0
    won: 0.0
    lost: 0.0
    moved: 0.0                # people moving
    founded: 0.0              # people founding a daughter settlement
    built: 0.0
    starved: 1000.0           # famine deaths in a settlement in one year (Round 4: small dips at capacity are not logged)
    died: 0.0                 # a settlement dissolving
    joined: 0.0               # people joining a band of their own lineage
    learned: 0.0              # people in a settlement that gained a technique (by invention or from a neighbour)
    forgot: 0.0               # people in a settlement that lost a technique
    depleted: 0.0             # a mineral deposit used up (only with world.minerals.depletion on)
    took: 0.0                 # a settlement taken by conquest (people); battles are filtered by war.battle_log_min_losses
    crossed: 0.0              # a sea crossing (sea cells crossed)

polities:                     # spec section 8; one polity per founding group at year 0
  contact_radius: 2           # settlements within this many hex steps are in contact (frontier, secession groups, culture drift)
  territory_radius: 1         # a polity controls its settlements' cells and cells within this many steps (deposit access)
  culture_mutation: 0.05      # sd of the change per culture trait (and intermarriage) when a polity inherits it at a split
  culture_contact_drift: 0.002  # per year, culture moves this share toward the mean culture of polities in contact,
                                # times the share of its settlements that touch them
  # Tribute and monuments follow the polity brain's outputs (Round 7):
  tribute_max_rate: 0.2       # share of each member's store taken per year = max rate x tribute output
                              # (x the marker factor, below)
  treasury_spoilage: 0.2      # share of the treasury lost per year
  monument_max_share: 0.3     # share of the treasury put toward monuments per year = max share x monument output
                              # (only once the capital holds megalithic construction)
  monument_cost: 100000.0     # rations (labour) per monument (tuning: 5,000 built ~7,800 monuments in 3,000 years)
  monument_upkeep: 0.01       # share of a monument's cost paid each year to keep it maintained
  # Secession: per settlement per year (never the capital)
  #   p = base x (distance to capital / reference) ** exponent x (1 - cohesion) x (1 + pressure_weight x pressure)
  #       x (1 + grievance_weight x the settlement's grievance)
  secession_base: 0.0001     # Round 6 tuning: 0.0005 -> 0.0002 -> 0.0001 (polity births, docs/ROUND12_NOTES.md)
  secession_distance_reference: 5.0
  secession_distance_exponent: 1.0
  secession_pressure_weight: 2.0
  secession_grievance_weight: 3.0
  secession_max: 0.05
  # Fragmentation: below this cohesion and above this pressure, the polity breaks into its regions with this chance per year
  fragment_cohesion: 0.1
  fragment_pressure: 0.3
  fragment_rate: 0.005       # Round 6 tuning: 0.02 -> 0.01 -> 0.005
  region_spacing: 4           # regional seats (largest settlements first) are at least this many hex steps apart
  # Mergers (spec: high shared memory and a common enemy): odds = merge_rate x min(1, memory.consequences.
  # merger_weight x the overlap of the two stores' heaviest symbols) x (1 if both are at war with one third polity).
  merge_rate: 0.01            # chance per year per pair in contact at full affinity and full common threat
  merge_crossover_chance: 0.5 # chance that the merged culture is a uniform crossover (each trait from either partner)
                              # instead of the larger partner's (and the same for its brain's weights)
  # Marker effects (spec "Ancestry, appearance and identity"): evolvable culture parameters of each polity
  # (agents/polity.py MARKER_EFFECTS) weighing a member's perceived appearance and dialect distance from its
  # capital (and, for secession, its culture distance). Zero in the founding polities, inherited with Gaussian
  # mutation at every split, free to go either way.
  marker_mutation: 0.05       # sd of the change per parameter at a split
  marker_effect_max: 3.0      # each parameter stays within [-max, max]
  marker_cohesion_decay: 0.01 # cohesion delta + this x (parameters . members' mean perceived distances); delta >= 0
  marker_grievance_rate: 0.01 # per year a member's grievance + this x (parameters . its distances), floored at 0
  marker_factor_max: 3.0      # tribute and secession odds x (1 + parameters . distances), clipped to [0, max]
  cohesion:                   # C' = C + growth_rate f C (1 - C) - delta C, plus maintained monuments
    founder_cohesion: 0.5     # founding groups at year 0
    child_cohesion: 0.5       # polities formed by secession or fragmentation
    growth_rate: 0.05         # r0
    distant_culture_min: 0.15 # culture distance (euclidean / sqrt(traits)) at which a neighbour starts to count as distant
    distant_culture_full: 0.4 # and counts fully
    base_decay: 0.002         # delta = base + size + distance + inequality + elite pressure + pressure terms
    size_decay: 0.005         # x settlements / (size_reference x admin_cap x (0.5 + hierarchy))
    size_reference_settlements: 20.0
    distance_decay: 0.003     # x mean hex steps from the capital / distance_reference
    distance_reference: 10.0
    inequality_decay: 0.01    # x population-weighted sd of log food per head across settlements
    elite_decay: 0.01         # x elite pressure
    pressure_decay: 0.01      # x structural-demographic pressure
    monument_cohesion: 0.01   # per year: + monument_cohesion x m / (m + monument_half) x (1 - C), m maintained monuments
    monument_half: 3.0
    war_frontier_weight: 0.5  # recent war joins f: f = min(1, culture frontier + weight x w / (w + half)),
    war_frontier_half: 2.0    # w = the polity's recent battles (war.war_recent_decay)
    grievance_decay: 0.01     # delta + this x population-weighted mean grievance of the members
  pressure:                  # structural-demographic pressure (>= 0)
    population_reference: 0.9 # population pressure: (people / capacity - reference) / (1 - reference), clipped to 0..1
    population_weight: 1.0
    elite_weight: 1.0         # x elite pressure = max(elite_ratio / positions - 1, 0)
    state_weight: 0.5         # minus state strength: (tribute - spending) per head / state_reference, capped at 1
    state_reference: 0.05
  elites:
    initial_ratio: 0.02       # tribute-takers per person in a new polity
    growth: 0.004             # logistic growth per year, times min(tribute per head / tribute_reference, 1)
    tribute_reference: 0.02
    decline: 0.02             # share lost per year while the polity's people are short of food on average
    positions: 0.04           # positions available per person = positions x (0.5 + hierarchy)

ancestry:                     # spec "Ancestry, appearance and identity": markers only, no capability effect
  appearance_traits: [skin_tone, hair_color, eye_color, stature]  # population mean and variance per settlement, 0..1
  founder_mean_min: 0.05      # each founding people's mean per trait, drawn uniformly
  founder_mean_max: 0.95
  founder_min_distance: 0.4   # euclidean distance between any two founding peoples' means
  founder_variance: 0.002
  founder_max_attempts: 1000
  teachers_appearance: []     # one value per trait to fix the teachers' means; empty = drawn like a founding people
  generation_years: 25        # drift runs once per generation
  drift_sigma: 0.01           # sd of the change per trait mean per generation at the reference population
  drift_reference_population: 1000.0  # sd x sqrt(reference / population): faster in small populations
  drift_sigma_max: 0.05
  mixing_rate: 0.02           # share of people exchanged per year with same-polity settlements in contact, x intermarriage
  intermarriage_min: 0.0      # founding polities' intermarriage rate, drawn uniformly (evolvable: mutates at splits)
  intermarriage_max: 1.0
  dialect_dims: 8
  dialect_founder_sigma: 1.0  # founding peoples' dialects: independent normal draws
  dialect_drift_sigma: 0.05   # per dimension per generation
  dialect_contact_rate: 0.005 # per year, dialect moves this share toward the population-weighted mean of settlements in contact
  dialect_assimilation_rate: 0.01  # per year, a conquered settlement's dialect moves this share x its ruler's openness
                                   # toward the ruler's capital (only while it is an unassimilated subject)
  selection_enabled: false    # optional environmental selection (spec: off by default)
  selection_trait: skin_tone
  selection_rate: 0.02        # per generation, share of the gap to the latitude optimum closed
  selection_optimum_equator: 0.8
  selection_optimum_pole: 0.2
  # Perception (Round 7): perceived distance = tanh(euclidean distance / reference), 0..1. The polity brains
  # read it (inputs and the per-neighbour target head) and the marker-effect culture parameters weigh it.
  blind_perception: false     # control: every perceived appearance and dialect distance is zero
  perceived_appearance_reference: 0.5
  perceived_dialect_reference: 4.0

war:                          # spec section 9; the choice follows the polity brains (Round 7)
  enabled: true
  # Choice. Candidate targets: foreign settlements in contact (polities.contact_radius) with one of the
  # attacker's. The brain's per-neighbour target head scores each (brains/features.py TARGET_FEATURES);
  # each polity attacks its best-scoring target with chance attack_rate x aggression output x score x
  # min(food per head, 1), as a campaign with chance = its campaign output (else a raid).
  attack_rate: 0.1
  max_wars: 2                 # a polity at war with this many polities only attacks those
  war_memory_years: 10        # a pair is at war until this many years after its last battle
  store_half_years: 0.5       # target feature: years of food stored per head s, as s / (s + half)
  # Strength S = P x mobilization x M_tech x (0.5 + cohesion) x D, D = exp(-km from the capital / (logistics_km x raid_range))
  # Mobilization share = base + militarism x m + hierarchy x h, capped. M_tech: product of the capital's
  # military multipliers (knowledge graph) and teachers.weapons_military while a member holds a weapons artifact.
  # The defender fights with the target settlement's people at full strength plus the rest of its
  # polity at D, times terrain_defense[cell], the target's defense multiplier (sedentary building) and home_bonus.
  mobilization_base: 0.02
  mobilization_militarism: 0.08
  mobilization_hierarchy: 0.04
  mobilization_max: 0.2
  logistics_km: 500.0
  home_bonus: 1.2
  terrain_defense:
    sea: 1.0
    plain: 1.0
    forest: 1.2
    hills: 1.5
    mountain: 2.0
    desert: 1.0
    steppe: 0.9
    wetland: 1.5
    tundra: 1.0
    ice: 1.0
  # Resolution: attacker wins with chance Sa^k / (Sa^k + Sd^k), k = win_steepness. Each side loses
  # casualty_rate x the other's strength (x loser_casualty_factor for the loser), capped: the attacker at
  # attacker_casualty_cap of its mobilized force (spread over its settlements by population), the
  # defender at defender_casualty_cap of the target settlement's people.
  win_steepness: 2.0
  casualty_rate: 0.2
  loser_casualty_factor: 2.0
  attacker_casualty_cap: 0.5
  defender_casualty_cap: 0.2
  raid_loot_share: 0.5        # share of the target's store a winning raid carries off
  # Campaign won: the target joins the attacker, and each other settlement of the loser in contact with it
  # (not its capital) with neighbor_capture_chance. Settlers from the attacking settlement move in:
  # settler_share x the target's people, at most settler_source_cap of the source's.
  neighbor_capture_chance: 0.3
  settler_share: 0.1
  settler_source_cap: 0.1
  # Capital taken: the loser's cohesion x (1 - capital_cohesion_loss) and the largest settlement left becomes
  # its capital; if the people it has left are fewer than destroy_ratio x the conqueror's, it is destroyed
  # and the conqueror takes every settlement it had.
  capital_cohesion_loss: 0.3
  destroy_ratio: 0.5
  battle_log_min_losses: 100.0  # battles with at least this many dead are logged (fought); raids won always are (won)
  war_recent_decay: 0.05      # per year, a polity's recent-battle count decays by this share (cohesion frontier term)
  enemy_military_diffusion: 0.05  # per battle, each military technique one side holds passes to the other's settlement
  subject_diffusion_rate: 0.1     # per year, each technique a subject settlement holds passes to its ruler's capital
  # After conquest (spec section 9): a conquered settlement keeps its own culture, gets grievance, and is a
  # subject until assimilated. Its culture moves toward its ruler's at assimilation_rate x the ruler's
  # openness x (1 + memory.consequences.assimilation_weight x shared-memory overlap, Round 8).
  grievance_conquest: 1.0
  grievance_decay: 0.01       # per year
  grievance_floor: 0.05       # a subject is assimilated once grievance is below this
  assimilation_rate: 0.01
  assimilated_distance: 0.02  # and its culture is this close to its ruler's (euclidean / sqrt(traits))

brains:                       # spec section 10: a fixed-topology MLP per polity, all evaluated in one batch a year
  hidden: 16                  # tanh units; inputs and outputs are listed in brains/features.py and brains/network.py
  recurrent_units: 0          # hidden units fed back as inputs the next year; 0 = off (spec default)
  memory_inputs: 3            # the memory summary (systems/memory.py SUMMARY): must match its length
  init_sigma: 2.0             # founding brains: every weight and bias ~ N(0, init_sigma / sqrt(fan in)) (history_seed);
                              # 2.0 spreads the founders' outputs about as widely as uniform 0..1 traits (sd ~0.26)
  marker_init_sigma: 0.0      # the same for weights that read appearance or dialect: they start at zero (spec hard rule)
  mutation_sigma: 0.05        # at a split every weight + N(0, sigma) ...
  jump_chance: 0.01           # ... and with this chance per weight a larger jump
  jump_sigma: 0.5
  frozen: false               # control: no mutation; every polity carries an exact copy of its founding brain
  features:                   # input normalisation, to about -1..1
    log_population_center: 3.0  # (log10 people - center) / scale, clipped
    log_population_scale: 2.0
    store_half_years: 0.5     # years of food stored per head s, as s / (s + half)
    elite_reference: 0.05     # tanh(elite ratio / reference)
    settlements_reference: 10.0  # tanh(settlements / reference)
    growth_window_years: 25   # territory growth: change in settlements over this many years, relative
    technique_reference: 5.0  # tanh(techniques known at the capital in a category / reference)
    strength_ratio_scale: 2.0 # tanh(ln(own strength / neighbour's) / scale)
    hostile_reference: 2.0    # tanh(polities at war with / reference)
    war_record_reference: 3.0 # tanh(recent battles won (lost) / reference)
    war_record_decay: 0.05    # per year the counts of battles won and lost decay by this share
    temp_anomaly_scale: 3.0   # tanh(climate anomaly degC / scale)

memory:                       # spec section 11: generic substrate, copying errors and consequences; no content
  enabled: true               # false: no memory at all (the reference for the control condition)
  control: false              # true: memory is recorded and transmitted but every consequence weight reads as zero
  generation_years: 25        # transmission runs once per generation
  capacity: 40                # K, memories per polity store, x the capital's memory_capacity multipliers (writing, printing)
  # Recording: each year's logged events, written to the store of every living polity taking part (as a
  # polity actor, or through a settlement actor). One rule for every verb (no per-verb weights):
  #   share = people of the holder affected / the holder's people (the whole polity when it is an actor itself,
  #           else its settlement actors' people when the event was logged), at most 1
  #   vividness = vividness_scale x log(1 + share / share_reference) / log(1 + 1 / share_reference)
  #               + novelty_bonus x (the verb is new to the store)
  #               + novelty_bonus x (some actor from outside the holder's polity is new to it)
  # Events below record_min_vividness are not recorded.
  vividness_scale: 1.0        # vividness of an event affecting the whole holder
  share_reference: 0.01       # the log scale's knee: a share this small gets ~15% of the scale
  novelty_bonus: 0.5          # per novelty: the first record of a verb, the first record of an outside actor, in a store
  record_min_vividness: 0.1
  vividness_max: 10000.0      # safety bound only (amplification is logarithmic in its count)
  symbol_min_vividness: 1.0   # an entity, place or event gets a symbol when it first enters memory at least this vivid
  # Transmission, per generation, per polity store (probabilities per memory):
  decay: 0.1                  # vividness x (1 - decay)
  floor: 0.05                 # when the store is full, memories below this vividness drop out
  detail_loss_chance: 0.1     # one field coarsens: the year to the next span, the place to its region and then to
                              # none, the magnitude to one significant figure
  # The year coarsens relative to the record's own age: at its k-th coarsening the span becomes this share of
  # the years since its original events (at least one year wider than before), centred on their mean year.
  year_span_fractions: [0.05, 0.15, 0.3, 0.5]
  region_cells: 8             # a region is a block of region_cells x region_cells cells
  merge_chance: 0.05          # fuse with another memory of the store sharing an actor, the place or a symbol,
                              # whose year span overlaps or touches its own
  merge_carry: 0.5            # the fused memory's vividness: the larger + merge_carry x the smaller
  max_provenance: 30          # a merge that would give a record more original events than this does not happen
  max_actors: 6               # the fused memory keeps the more vivid one's actors and symbols, then the other's,
  max_symbols: 12             # up to these many
  substitution_chance: 0.03   # one actor is replaced by an entity of the store, drawn by its total vividness
  repeat_gain: 0.1            # when a new memory shares the action and a symbol with one held, that one gains:
                              # the k-th time, repeat_gain x the new vividness x log((k + 1) / k) (amplification by
                              # repetition; n repetitions of equal events add repeat_gain x v x log(n + 1) in all)
  borrow_contact_rate: 0.1    # per polity pair in contact, x the receiver's openness: one memory is copied over
  borrow_conquest_rate: 0.2   # per subject settlement: one memory it holds from another store is copied to its ruler's
  borrow_vividness: 0.5       # a copied memory's vividness x this
  spread_rate: 0.5            # per member settlement, per memory held by a member in contact: chance it is taken up
  holding_loss: 0.05          # per settlement, per memory it holds: chance it is lost
  shared_majority: 0.5        # a memory counts as shared when held by at least this share of the polity's people
  heavy_symbols: 10           # the heaviest symbols of a store used for affinity, legitimacy and invocation
  # The vividness references below are scale-free: in units of the median vividness of the store's own
  # memories (m), so they mean the same however vivid a store's memories are overall.
  summary_weight_medians: 10.0  # brain input: tanh(heaviest symbol weight / (this x m))
  summary_age_reference: 500.0    # brain input: tanh(mean age of memories in years / reference)
  consequences:               # every weight reads as zero with control: true
    cohesion_weight: 0.01     # cohesion + weight x S / (S + half) x (1 - C), S = vividness of the shared memories,
    cohesion_half_medians: 10.0  # half = this x m
    legitimacy_weight: 0.5    # secession odds x (1 - weight x L), L = w / (w + half), w = weight of the symbols of
    legitimacy_half_medians: 5.0  # the capital, the polity, its parent polities and its founding lineage; half = this x m
    merger_weight: 1.0        # merger odds = polities.merge_rate x min(1, weight x heavy-symbol overlap) x common enemy
    assimilation_weight: 1.0  # assimilation rate x (1 + weight x overlap of the subject's memories with its ruler's)
    invocation_gain: 0.05     # before a battle, a monument or a union: each memory of the heaviest related symbols
                              # gains, the k-th time, gain x its starting vividness x log((k + 1) / k)
    invocation_symbols: 3
    brain_input_weight: 1.0   # the memory summary inputs x weight

output:                       # headless runs (scripts/run.py, scripts/batch.py); no effect on the simulation
  runs_dir: runs
  lineages_every_years: 10    # lineages.parquet: one row per founding lineage every this many years
  polities_every_years: 25    # polities.parquet: one row per living polity every this many years
  memory_snapshot_every_years: 500  # memory_snapshots/: every store's records, every this many years and at the end
  checkpoint_every_years: 500 # checkpoints/: the pickled model, to resume or fork a run
  checkpoints_kept: 2         # the latest this many checkpoints stay on disk (0: all)
  batch_workers: 2            # scripts/batch.py: runs in parallel at most, and further limited by free memory:
  batch_run_memory_mb: 1000   # memory one run is assumed to need
  batch_memory_reserve_mb: 500  # memory left free for the rest of the machine
  bounds_file: bounds.yaml    # physical bounds (Round 12): ceilings.parquet measures each year against them

viz:                          # browser UI only; no effect on the simulation
  play_interval_ms: 0         # pause between frames while playing
  play_interval_max_ms: 500   # slider range
  render_interval: 25         # years stepped per frame while playing, and per click of Step
  render_interval_max: 100    # slider range
  step_buttons: [1, 10, 100]  # years per click of the step buttons
  # The one lineage palette: one colour per founding group, in founders.names order, used by every
  # lineage-coloured element (lineage and polity overlays, the population-per-group plot, legends).
  lineage_colors: ["#e41a1c", "#377eb8", "#4daf4a", "#984ea3", "#ff7f00"]
  # Polity overlay: each claimed cell (a member's cell and land within polities.territory_radius of it, given
  # to the nearest member) in its founding group's hue; brightness from the chosen "shade by" variable.
  polity_shade_by: [population density, technology level, subsistence output]  # options of the "shade by" selector (viz/portrayal.py SHADE_BY)
  polity_density_min: 0.01    # people / km2 at the lightest shade (log scale; less is drawn as this)
  polity_density_max: 10.0    # people / km2 at the darkest shade
  polity_shade_levels: 12     # brightness steps per group
  polity_light: 0.6           # lightest: the colour lightened by this share toward white
  polity_dark: 0.6            # darkest: the colour darkened by this share toward black
  border_peoples_width: 2.4   # line between polities of different founding groups
  border_polities_width: 0.8  # line between polities of the same founding group
  border_outline_width: 1.6   # each border is drawn over a light outline this much wider
  border_color: "#202020"
  border_outline_color: "#f4f4f4"
  resource_colors:            # resources overlay: one per mineral, and cells with several
    copper: "#d95f02"
    tin: "#7f7f7f"
    iron_ore: "#a6361c"
    coal: "#1a1a1a"
    oil: "#7b3294"
    several: "#e7298a"
  knowledge_color: "#1a9850"  # knowledge overlay: techniques known per cell
  knowledge_vmax: 14.0        # techniques usable where the settlement is
  latent_color: "#762a83"     # latent overlay: techniques held where they cannot be used
  latent_vmax: 5.0
  population_color: "#b2182b" # population overlay
  population_vmax: 2000.0     # people per cell at full opacity
  population_alpha_curve: 30.0  # opacity = log(1 + c x) / log(1 + c), x = people / vmax: small bands stay visible
  polity_output_min: 0.01     # "shade by" subsistence output: rations available per km2, lightest (log scale)
  polity_output_max: 10.0     # ... darkest
  mode_colors: {forage: "#8c510a", herd: "#d6b23a", farm: "#1b7837"}  # subsistence layer: shares mix these
  cohesion_cmap: viridis      # cohesion layer: matplotlib colour map over 0..1
  capital_px: 4.0             # overlays (sizes in screen pixels, at any zoom)
  monument_px: 2.5
  monument_color: "#000000"
  war_color: "#d00000"        # active wars: arrows from the attacker's capital to the defender's
  war_px: 1.8
  teachers_color: "#ff00ff"   # the teachers' path and position during the contact phase
  teachers_px: 2.0
  map_height_px: 620
  max_zoom: 40.0              # zoom in at most this far (the whole map at 1)
  panel_interval: 5           # frames between refreshes of the charts and the lineage tree while playing
  chart_points: 400           # points per series drawn in the charts
  chart_width_px: 330
  chart_height_px: 150
  tree_width_px: 680
  tree_row_px: 3.0            # rows of the lineage tree, px each (capped by tree_max_height_px)
  tree_max_height_px: 700
  inspector_symbols: 5        # polity inspector: heaviest symbols shown, events per record, origin records
  inspector_events: 4
  inspector_origins: 12
  inspector_file: inspector.yaml  # the inspector's words (relative to this file)

render:                       # static PNG maps only; no effect on the simulation
  dpi: 110
  hillshade_azimuth_deg: 315.0
  hillshade_altitude_deg: 40.0
  vertical_exaggeration: 25.0
  hillshade_ambient: 0.45
  river_min_order: 3          # draw rivers of this Strahler order and up
  river_width_min: 0.6        # line width at river_min_order
  river_width_max: 3.2        # line width at the world's highest order
  coast_linewidth: 0.7
  flood_years: [0, 1000, 2000, 3000]
  population_years: [0, 500, 1000, 2000, 3000]   # population-density maps (scripts/render_population.py)
  population_density_min: 0.001  # people / km2, colour scale
  population_density_max: 0.2
  knowledge_years: [50, 500, 2000, 5000]   # technique maps (scripts/render_knowledge.py)

reports:                      # analysis reports only (analysis/); no effect on the simulation
  origins_until_year: 100     # myths report "Origins" and the narrator: records descending from events in years 0 to this
  narrator_file: narrator.yaml  # analysis/narrator.py: name syllables, technique phrases, templates (relative to this file)
  sample_names: 20            # narrator: settlement names shown per people
  # Places without a name (deluge/gazetteer.py): told by direction from the nearest named place,
  # "east of Mebu" up to this many hex steps (a cell is about 165 km across), "far to the east of
  # Mebu" up to place_far_cells, beyond that by their land.
  place_near_cells: 2
  place_far_cells: 6

chronicle:                    # the browser chronicle (deluge/data/chronicle.py); no effect on the simulation
  # Which events are told one by one. Every rule reads only an event's action code, the kinds and
  # ids of its actors and its numbers; every other event is counted in its generation's summary.
  generation_years: 25        # routine events are summed per this many years
  death_share: 0.05           # share_actions: told when magnitude / the smallest population among the
