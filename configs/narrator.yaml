# Deterministic narrator (analysis/narrator.py): data only, read by the analysis, never by the
# simulation. Plain language: what the sim did, said in ordinary words.

names:
  # A name is drawn from this inventory by a pure function of (entity, people's dialect, seeds):
  # the entity and the seeds fix the uniform draws; the people's dialect vector sets the weights,
  # weight = exp(dialect_scale x (dialect . direction of the item)), each item's direction a fixed
  # unit vector hashed from its spelling. Peoples whose dialects differ favour different pieces,
  # and drift apart as their dialects do.
  # The dialect weighs the sound traditions below (which one a name is drawn from) and, inside a
  # tradition, its pieces.
  dialect_scale: 1.5
  syllables: [[2, 0.5], [3, 0.38], [4, 0.12]]   # [syllables (vowel groups) in the name, chance]
  templates: [["V", 0.15], ["CV", 0.55], ["CVC", 0.30]]  # shape of each syllable between the start and the ending
  cluster_chance: 0.15        # a CV or CVC syllable opens with one of the tradition's clusters instead
  initial_chance: 0.5         # the name opens with one of the tradition's initials
  ending_chance: 0.75         # the name closes with one of the tradition's endings
  max_letters: 13             # pieces that would make it longer are left out
  # Phonotactics, checked on every piece added (a piece that breaks one is replaced by a plainer one):
  vowel_letters: "aeiou"
  digraphs: ["sh", "th", "kh", "ch", "ph", "zh", "dh", "bh", "gh", "jh", "ts"]  # one consonant each
  max_vowel_run: 2            # no more than two vowel letters in a row
  max_clusters: 1             # at most one run of two or more consonants per name
  allowed_doubles: ["ll", "nn", "ss", "rr"]  # no other letter may stand twice in a row
  # Pieces from real name patterns of four traditions. Quoted: YAML would read some bare
  # pieces (y, n, on, ...) as booleans.
  traditions:
    persian:                  # Avestan and Persian
      initials: ["ard", "mehr", "yaz", "dar", "far", "kur", "vah", "zar", "ash", "bah", "ros", "tir", "kav", "jam"]
      consonants: ["b", "d", "f", "g", "h", "k", "kh", "m", "n", "p", "r", "s", "sh", "t", "v", "y", "z"]
      clusters: ["fr", "sp", "st", "hv", "br", "khsh"]
      vowels: ["a", "a", "e", "i", "o", "u", "ai", "ei"]
      codas: ["r", "n", "sh", "d", "s", "z", "h"]
      endings: ["ush", "esh", "an", "ad", "ar", "ana", "aspa", "ak", "ish", "dad"]
    hebrew:
      initials: ["ab", "el", "ya", "sha", "mi", "na", "ze", "yo", "be", "ha", "re", "ad", "yeh", "ash"]
      consonants: ["b", "d", "g", "h", "k", "kh", "l", "m", "n", "p", "r", "s", "sh", "t", "ts", "v", "y", "z"]
      clusters: ["shm", "br", "dr", "tsv"]
      vowels: ["a", "a", "e", "i", "o", "u", "ai"]
      codas: ["l", "m", "n", "r", "s", "th", "k", "v"]
      endings: ["el", "im", "ah", "ath", "iah", "on", "ai", "ek", "oth", "iel"]
    greek:
      initials: ["the", "ar", "kal", "dem", "phil", "ni", "an", "ly", "eu", "kle", "pe", "me", "ze", "xen"]
      consonants: ["b", "d", "g", "k", "l", "m", "n", "p", "r", "s", "t", "ph", "th", "kh", "x", "z"]
      clusters: ["kl", "kr", "pr", "tr", "st", "ps", "dr"]
      vowels: ["a", "e", "i", "o", "u", "eu", "ai", "oi"]
      codas: ["s", "n", "r", "l", "x"]
      endings: ["os", "on", "ia", "eus", "es", "as", "ides", "ope", "ion", "ias"]
    sanskrit:
      initials: ["in", "ra", "vi", "dev", "sur", "ar", "ma", "su", "bha", "gan", "lak", "sam", "har", "nar"]
      consonants: ["b", "bh", "d", "dh", "g", "gh", "h", "j", "k", "kh", "m", "n", "p", "r", "s", "sh", "t", "th", "v",
                   "y"]
      clusters: ["kr", "pr", "sv", "sr", "dr", "tr", "shr"]
      vowels: ["a", "a", "i", "u", "e", "o", "ai", "au"]
      codas: ["n", "m", "r", "sh", "t", "s"]
      endings: ["an", "isha", "ra", "endra", "ita", "ika", "esh", "ana", "ini", "aya"]

# Techniques, minerals and what the groups could witness, in plain words.
techniques:
  animal_domestication: the keeping of herds
  agriculture: the sowing of fields
  storage: the storing of grain
  sedentary_building: the building of lasting houses
  division_of_labor: the dividing of work
  sky_calendar: the reckoning of seasons by the sky
  megalithic_construction: the raising of great stones
  irrigation: the leading of water to the fields
  sailing: the sailing of boats
  copper_bronze: the working of copper and bronze
  writing: the writing of signs
  plough: the ploughing of land
  horse_riding: the riding of horses
  iron: the working of iron
  open_sea_voyaging: voyaging across the open sea
  ocean_navigation: the navigating of far oceans
  printing: the printing of signs
  mechanical_power: the turning of mills by water and wind
  chemistry: the mixing of substances
  gunpowder: the making of blasting powder
  steel: the making of steel
  coal_mining: the digging of coal
  steam_power: the driving of engines by steam
  railways_steamships: the running of rails and steam ships
  synthetic_fertilizers: the making of fertilizers
  modern_medicine: the practice of modern medicine
  electricity: the harnessing of electricity
  telecommunication: the sending of messages over wires
  oil_combustion: the burning of oil in engines
minerals:
  copper: copper
  tin: tin
  iron_ore: iron ore
  coal: coal
  oil: oil
technologies:
  flight: flying craft
  weapons: weapons
  tools: tools
  medicine: medicine

# How each kind of entity is spoken of; {name} is its generated name, {phrase} its plain phrase.
forms:
  settlement: "{name}"
  polity: "the {name} people"
  lineage: "the {name}"
  first_kind: "the {name}"    # the entity kind listed first in the event log's kinds
  technique: "{phrase}"
  technology: "{phrase}"
  artifact: "a gift of {phrase}"
  deposit: "the {phrase} {place}"
  monument: "a monument"
# Places (deluge/gazetteer.py): a cell is named only while a settlement stands on it ({name}: the
# settlement's name); a place with no name is told by {direction} and distance from the nearest
# named place, by its land, or as the sea. Each form says where something happened ("at Mebu").
places:
  cell: "at {name}"
  region: "in the country of {name}"
  region_unnamed: "in the country {where}"
  near: "{direction} of {name}"
  far: "far to the {direction} of {name}"
  land: "in the land of {name}"
  empty_land: "in an unpeopled land"
  sea: "on the open sea"
  none: "in a place no longer named"
# The same places as where something went ({to} in a sentence): "crossed the sea from Mebu to an unpeopled land".
destinations:
  cell: "to {name}"
  region: "to the country of {name}"
  region_unnamed: "to the country {where}"
  near: "to the land {direction} of {name}"
  far: "to the land far to the {direction} of {name}"
  land: "to the land of {name}"
  empty_land: "to an unpeopled land"
  sea: "to the open sea"
  none: "to a place no longer named"
times:
  year: "in year {year}"
  span: "in the years {year} to {last}"
  first_age: "in the first age"
  run: "from year {year} to {last}"
joiner: " and "
# Verbs whose events with only their first two actors (a contact that passed on nothing) are told once
# from the first to the last, in "What happened".
stays: [taught, gave]

# Roles (deluge/roles.py). Each actor of an event holds a role, fixed by the slot it holds: per verb,
# or per "verb/kind of the first actor", or per "verb/kind of the first actor/verb of the event it is
# part of" (the most specific that exists), one role per position. A role written as a map depends
# on the actor's own kind; a role ending in "+" takes every actor from that position on. Memory
# records keep each actor's slot (a substituted actor takes over the slot it replaced).
roles:
  arrived: [visitor, host, craft]
  taught: [instructor, learner, lesson+]
  displayed: [displayer, witness, shown]
  departed: [visitor, host, craft]
  gave: [giver, receiver, gift+]
  used: [used, user]
  broke: [broken, keeper]
  fought: [attacker, defender, attacked]
  fought/settlement: [attacker, defender]
  won: [raider, raided, plundered]
  lost: [loser, capital, taker]
  lost/settlement: [loser, victor]
  moved: [mover]
  founded: [new_settlement, mother]
  founded/polity: [new_people, {polity: parent_people, settlement: seat}]
  built: [builder, monument, site]
  starved: [hungry]
  died: [ended, destroyer]
  joined: [joiner_band, host_band]
  joined/polity: [joiner_people, host_people]
  learned: [learner, lesson, source]
  forgot: [forgetter, lesson]
  depleted: [deposit]
  took: [taker, taken, former]
  crossed/polity: [attacker, setout, attacked, defender]
  crossed/settlement: [crosser, {settlement: mother, polity: owner}]
  crossed/settlement/founded: [crosser, mother]
  crossed/settlement/joined: [crosser, host_band]
  allied: [sworn, sworn_with]
  joined_war: [helper, aided, foe, front]
  alliance_ended: [leaver, left]
  betrayed: [betrayer, wronged]
# Roles held by things (techniques, crafts, gifts, deposits, monuments); every other role is held by
# a group of people. A thing is never told as a companion: it stands in its own role.
thing_roles: [craft, lesson, shown, gift, used, broken, monument, deposit]

# Sentences, per verb: the first shape whose roles are exactly the roles present is used. {role} is the
# actors holding it (several joined by "and"), {at} where it happened (left out when the place bears
# the name of a settlement the sentence names), {be} agrees with the first role named. A record whose
# actors hold no such set of roles of its verb is told in the loose form (below).
sentences:
  arrived: ["{visitor} came to {host}{at} by {craft}"]
  taught: ["{instructor} taught {learner} {lesson}", "{instructor} stayed at {learner}"]
  displayed: ["{displayer} showed {witness} {shown}"]
  departed: ["{visitor} left {host}{at} by {craft}"]
  gave: ["{giver} gave {receiver} {gift}", "{giver} stayed at {receiver}"]
  used: ["{user} made use of {used}"]
  broke: ["{broken} kept by {keeper} broke"]
  fought: ["{attacker} attacked {attacked} of {defender}{at}", "{attacker} attacked {defender}{at}",
           "{attacker} attacked {attacked}{at}"]
  won: ["{raider} raided {plundered} of {raided}{at}", "{raider} raided {raided}{at}"]
  lost: ["{loser} lost {capital} to {taker}", "{loser} {be} beaten back by {victor}{at}", "{loser} lost {capital}"]
  moved: ["{mover} moved and settled{at}"]
  founded: ["{mother} founded {new_settlement}{at}", "{new_people} rose from {parent_people}{at}",
            "{new_people} {be} founded at {seat}", "{new_settlement} {be} founded{at}", "{new_people} arose{at}"]
  built: ["{builder} raised {monument} at {site}", "{builder} raised {monument}{at}"]
  starved: ["{hungry} went hungry{at}"]
  died: ["{destroyer} destroyed {ended}{at}", "{ended} came to an end{at}"]
  joined: ["{joiner_band} joined {host_band}", "{joiner_people} joined {host_people}{at}"]
  learned: ["{learner} learned {lesson} from {source}", "{learner} learned {lesson}"]
  forgot: ["{forgetter} forgot {lesson}"]
  depleted: ["{deposit} {be} used up"]
  took: ["{taker} took {taken} from {former}", "{taker} took {taken}"]
  crossed: ["{attacker} crossed the sea from {setout} to attack {attacked} of {defender}",
            "{attacker} crossed the sea to attack {attacked}", "{crosser} crossed the sea from {mother}{to}",
            "{crosser} crossed the sea to join {host_band}", "{crosser} of {owner} crossed the sea and settled{at}",
            "{crosser} crossed the sea and settled{at}"]
  allied: ["{sworn} and {sworn_with} swore alliance", "{sworn} swore alliance"]
  joined_war: ["{helper} came to the aid of {aided} against {foe} at {front}",
               "{helper} came to the aid of {aided} against {foe}", "{helper} came to the aid of {aided}{at}",
               "{helper} went to war against {foe}{at}"]
  alliance_ended: ["{leaver} and {left} parted ways", "{leaver} left their alliance"]
  betrayed: ["{betrayer} broke faith with {wronged}", "{betrayer} broke faith{at}"]
# A conquest in the chronicle: the taking of a settlement, the loss of a seat and the end of a people,
# of one year, victor and settlement, told as one sentence (the size: the end's, else the taking's).
conquest:
  destroyed: "{taker} took {taken} and destroyed {former}"
  seat: "{taker} took {taken}, the seat of {former}"
# Runs of one event (same verb, the same groups of people, the same place; chronicle.run_gap_years):
# told once over their years. A verb listed here has its own shape with {count}; any other adds "run".
run_sentences:
  built: ["{builder} raised {count} monuments at {site}", "{builder} raised {count} monuments{at}"]
# The loose form, for a record whose roles no longer make a sentence: the groups of people, then what
# was done (with the things it held), where and when: "Of the Kavar and the Vahza, and a battle at
# Adtova, in the first age".
loose:
  people: "of {agents}"
  deed: "and {deed}"
  things: "{deed}, and {things}"
  deeds:
    arrived: a coming
    taught: a teaching
    displayed: a showing
    departed: a leaving
    gave: a giving
    used: a using
    broke: a breaking
    fought: a battle
    won: a raid
    lost: a loss
    moved: a moving
    founded: a founding
    built: a building
    starved: a hunger
    died: an ending
    joined: a joining
    learned: a learning
    forgot: a forgetting
    depleted: a using up
    took: a taking
    crossed: a crossing of the sea
    allied: an alliance
    joined_war: an aid in war
    alliance_ended: a parting of allies
    betrayed: a breaking of faith
# Verb agreement: {be} reads as one of these, by the first role named (spoken of as many people or one).
be: {one: was, many: were}
plural_kinds: [polity, lineage, first_kind]  # first_kind: the entity kind listed first in the event log's kinds
# Several actors with the same name are counted ("two gifts of medicine").
plural_forms:
  artifact: "{count} gifts of {phrase}"
  monument: "{count} monuments"
  technology: "{count} kinds of {phrase}"
  default: "{name} ({count} times)"
numbers: [zero, one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve]
# Runs of one event (same verb, the same groups of people and place) are told once; a verb with no
# run sentence of its own adds this.
run: " {count} times"
# Sizes of what happened (event log magnitudes), only in "What happened"; a pair is [one, many].
amounts:
  arrived: ["{m} person there", "{m} people there"]
  fought: "{m} dead"
  starved: "{m} dead"
  moved: ["{m} person", "{m} people"]
  founded: ["{m} person", "{m} people"]
  joined: ["{m} person", "{m} people"]
  took: ["{m} person", "{m} people"]
  died: ["{m} person left", "{m} people left"]
  crossed: ["{m} sea cell", "{m} sea cells"]
  allied: ["{m} person", "{m} people"]
  joined_war: "{m} dead"
  alliance_ended: ["after {m} year", "after {m} years"]
  betrayed: ["after {m} year of alliance", "after {m} years of alliance"]
# The chronicle (deluge/data/chronicle.py): what it adds to an event's sentence, and its summaries.
chronicle:
  first_anywhere: ", the first anywhere to know {phrase}"
  first_people: ", the first of {people} to know {phrase}"
  first_land_people: ", the first of {people} to reach another land"
  first_land_tier: ", the first crossing to another land that needed {phrase}"
  summary: "from year {year} to {last}, among {people}: {items}."
  summary_none: "from year {year} to {last}: {items}."
  item_joiner: "; "
# Summary items, one per verb (or verb/kind of the first actor) of a generation's routine events:
# {count} events, {actors} distinct first actors, {phrase} the technique among the actors; a pair is
# [one, many], chosen by the number the second form shows.
summaries:
  learned: ["{phrase} spread to one settlement", "{phrase} spread to {actors} settlements"]
  forgot: ["one settlement forgot {phrase}", "{actors} settlements forgot {phrase}"]
  taught: ["one year of contact passed on nothing", "{count} years of contact passed on nothing"]
  used/deposit: ["a deposit was first worked", "{count} deposits were first worked"]
  used/artifact: ["a gift was put to use", "gifts were put to use {count} times"]
  moved: ["one band moved", "{actors} bands moved"]
  joined/settlement: ["one band joined another", "{actors} bands joined others"]
  founded/settlement: ["a new settlement was founded", "{count} new settlements were founded"]
  won: ["a raid was won", "{count} raids were won"]
  took: ["a settlement was taken", "{count} settlements were taken"]
  fought: ["a smaller battle was fought", "{count} smaller battles were fought"]
  starved: ["one settlement went hungry", "{actors} settlements went hungry"]
  died/settlement: ["one settlement came to an end", "{actors} settlements came to an end"]
  crossed: ["the sea was crossed once", "the sea was crossed {count} times"]
  crossed/polity: ["one attack crossed the sea", "{count} attacks crossed the sea"]
  joined_war: ["an ally joined a battle", "allies joined battles {count} times"]
  allied: ["an alliance was sworn", "{count} alliances were sworn"]
  alliance_ended: ["allies parted ways", "allies parted ways {count} times"]
  betrayed: ["an ally broke faith", "allies broke faith {count} times"]
  displayed: ["one thing was shown", "{count} things were shown"]
  broke: ["a gift broke", "{count} gifts broke"]
  depleted: ["a deposit was used up", "{count} deposits were used up"]
  default: ["{verb}: once", "{verb}: {count} times"]

# "What memory changed".
changes:
  substituted: "{new} took the place of {old} (year {year})"
  fused: "{n} other events fused into it"
  actors_lost: "no longer remembered among its actors: {names}"
  year_lost: "the exact year, now a span of {span} years"
  place_region: "the exact place, now a region"
  place_none: "the place"
  size_lost: "the exact size"
  none: "nothing"
