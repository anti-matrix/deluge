# Deterministic narrator (analysis/narrator.py): data only, read by the analysis, never by the
# simulation. Plain language: what the sim did, said in ordinary words.

names:
  # A name is drawn from this inventory by a pure function of (entity, people's dialect, seeds):
  # the entity and the seeds fix the uniform draws; the people's dialect vector sets the weights,
  # weight = exp(dialect_scale x (dialect . direction of the item)), each item's direction a fixed
  # unit vector hashed from its spelling. Peoples whose dialects differ favour different pieces,
  # and drift apart as their dialects do.
  # The dialect weighs the sound traditions below (which one a name is drawn from) and, inside a
  # tradition, its pieces.
  dialect_scale: 1.5
  syllables: [[2, 0.5], [3, 0.38], [4, 0.12]]   # [syllables (vowel groups) in the name, chance]
  templates: [["V", 0.15], ["CV", 0.55], ["CVC", 0.30]]  # shape of each syllable between the start and the ending
  cluster_chance: 0.15        # a CV or CVC syllable opens with one of the tradition's clusters instead
  initial_chance: 0.5         # the name opens with one of the tradition's initials
  ending_chance: 0.75         # the name closes with one of the tradition's endings
  max_letters: 13             # pieces that would make it longer are left out
  # Phonotactics, checked on every piece added (a piece that breaks one is replaced by a plainer one):
  vowel_letters: "aeiou"
  digraphs: ["sh", "th", "kh", "ch", "ph", "zh", "dh", "bh", "gh", "jh", "ts"]  # one consonant each
  max_vowel_run: 2            # no more than two vowel letters in a row
  max_clusters: 1             # at most one run of two or more consonants per name
  allowed_doubles: ["ll", "nn", "ss", "rr"]  # no other letter may stand twice in a row
  # Pieces from real name patterns of four traditions. Quoted: YAML would read some bare
  # pieces (y, n, on, ...) as booleans.
  traditions:
    persian:                  # Avestan and Persian
      initials: ["ard", "mehr", "yaz", "dar", "far", "kur", "vah", "zar", "ash", "bah", "ros", "tir", "kav", "jam"]
      consonants: ["b", "d", "f", "g", "h", "k", "kh", "m", "n", "p", "r", "s", "sh", "t", "v", "y", "z"]
      clusters: ["fr", "sp", "st", "hv", "br", "khsh"]
      vowels: ["a", "a", "e", "i", "o", "u", "ai", "ei"]
      codas: ["r", "n", "sh", "d", "s", "z", "h"]
      endings: ["ush", "esh", "an", "ad", "ar", "ana", "aspa", "ak", "ish", "dad"]
    hebrew:
      initials: ["ab", "el", "ya", "sha", "mi", "na", "ze", "yo", "be", "ha", "re", "ad", "yeh", "ash"]
      consonants: ["b", "d", "g", "h", "k", "kh", "l", "m", "n", "p", "r", "s", "sh", "t", "ts", "v", "y", "z"]
      clusters: ["shm", "br", "dr", "tsv"]
      vowels: ["a", "a", "e", "i", "o", "u", "ai"]
      codas: ["l", "m", "n", "r", "s", "th", "k", "v"]
      endings: ["el", "im", "ah", "ath", "iah", "on", "ai", "ek", "oth", "iel"]
    greek:
      initials: ["the", "ar", "kal", "dem", "phil", "ni", "an", "ly", "eu", "kle", "pe", "me", "ze", "xen"]
      consonants: ["b", "d", "g", "k", "l", "m", "n", "p", "r", "s", "t", "ph", "th", "kh", "x", "z"]
      clusters: ["kl", "kr", "pr", "tr", "st", "ps", "dr"]
      vowels: ["a", "e", "i", "o", "u", "eu", "ai", "oi"]
      codas: ["s", "n", "r", "l", "x"]
      endings: ["os", "on", "ia", "eus", "es", "as", "ides", "ope", "ion", "ias"]
    sanskrit:
      initials: ["in", "ra", "vi", "dev", "sur", "ar", "ma", "su", "bha", "gan", "lak", "sam", "har", "nar"]
      consonants: ["b", "bh", "d", "dh", "g", "gh", "h", "j", "k", "kh", "m", "n", "p", "r", "s", "sh", "t", "th", "v",
                   "y"]
      clusters: ["kr", "pr", "sv", "sr", "dr", "tr", "shr"]
      vowels: ["a", "a", "i", "u", "e", "o", "ai", "au"]
      codas: ["n", "m", "r", "sh", "t", "s"]
      endings: ["an", "isha", "ra", "endra", "ita", "ika", "esh", "ana", "ini", "aya"]

# Techniques, minerals and what the groups could witness, in plain words.
techniques:
  animal_domestication: the keeping of herds
  agriculture: the sowing of fields
  storage: the storing of grain
  sedentary_building: the building of lasting houses
  division_of_labor: the dividing of work
  sky_calendar: the reckoning of seasons by the sky
  megalithic_construction: the raising of great stones
  irrigation: the leading of water to the fields
  sailing: the sailing of boats
  copper_bronze: the working of copper and bronze
  writing: the writing of signs
  plough: the ploughing of land
  horse_riding: the riding of horses
  iron: the working of iron
  ocean_navigation: the crossing of open seas
  printing: the printing of signs
  mechanical_power: the turning of mills by water and wind
  chemistry: the mixing of substances
  gunpowder: the making of blasting powder
  steel: the making of steel
  coal_mining: the digging of coal
  steam_power: the driving of engines by steam
  railways_steamships: the running of rails and steam ships
  synthetic_fertilizers: the making of fertilizers
  modern_medicine: the practice of modern medicine
  electricity: the harnessing of electricity
  telecommunication: the sending of messages over wires
  oil_combustion: the burning of oil in engines
minerals:
  copper: copper
  tin: tin
  iron_ore: iron ore
  coal: coal
  oil: oil
technologies:
  flight: flying craft
  weapons: weapons
  tools: tools
  medicine: medicine

# How each kind of entity is spoken of; {name} is its generated name, {phrase} its plain phrase.
forms:
  settlement: "{name}"
  polity: "the {name} people"
  lineage: "the {name}"
  first_kind: "the {name}"    # the entity kind listed first in the event log's kinds
  technique: "{phrase}"
  technology: "{phrase}"
  artifact: "a gift of {phrase}"
  deposit: "the {phrase} of {place}"
  monument: "a monument"
places:
  cell: "{name}"
  region: "the country of {name}"
  none: "a place no longer named"
times:
  year: "in year {year}"
  span: "in the years {year} to {last}"
  first_age: "in the first age"
  run: "from year {year} to {last}"
someone: someone
nothing: nothing             # {rest} when the verb has no third actor
with_others: ", with {others}"
joiner: " and "

# One sentence shape per verb: {0}, {1}, ... are the actors in order, {rest} the actors from the
# third on, {from_} " from" the third actor when there is one, {place} and {time} as above.
templates:
  arrived: "{time}, {0} came to {1} at {place}, by {2}"
  taught: "{time}, {0} taught {1} {rest}"
  displayed: "{time}, {0} showed {1} {2}"
  departed: "{time}, {0} left {1} at {place}, by {2}"
  gave: "{time}, {0} gave {1} {rest}"
  used: "{time}, {1} made use of {0}"
  broke: "{time}, {0} held by {1} broke"
  fought: "{time}, {0} fought {1} at {place}"
  won: "{time}, {0} raided {1} at {place}"
  lost: "{time}, {0} lost {1} to {2}"
  moved: "{time}, {0} moved to {place}"
  founded: "{time}, {0} {be} founded from {1} at {place}"
  built: "{time}, {0} built {1} at {place}"
  starved: "{time}, {0} went hungry"
  died: "{time}, {0} came to an end"
  joined: "{time}, {0} joined {1}"
  learned: "{time}, {0} learned {1}{from_}"
  forgot: "{time}, {0} forgot {1}"
  depleted: "{time}, {0} {be} used up"
  took: "{time}, {0} took {1} from {2}"
  crossed: "{time}, {0} crossed the sea to {place}"
# The shape for a verb when the event has only its first two actors (a teaching contact that passed on nothing).
empty_templates:
  taught: "{time}, {0} stayed with {1}"
  gave: "{time}, {0} stayed with {1}"
# Verb agreement: {be} in a template reads as one of these, by the first actor (spoken of as many people or one).
be: {one: was, many: were}
plural_kinds: [polity, lineage, first_kind]  # first_kind: the entity kind listed first in the event log's kinds
# Several actors with the same name are counted ("two gifts of medicine").
plural_forms:
  artifact: "{count} gifts of {phrase}"
  technology: "{count} kinds of {phrase}"
  default: "{name} ({count} times)"
numbers: [zero, one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve]
# Runs of identical events (same verb, actors and place in a row) are told once.
run: " ({count} times)"
# Sizes of what happened (event log magnitudes), only in "What happened".
amounts:
  arrived: "{m} people there"
  fought: "{m} dead"
  starved: "{m} dead"
  moved: "{m} people"
  founded: "{m} people"
  joined: "{m} people"
  took: "{m} people"
  died: "{m} people left"
  crossed: "{m} sea cells"
# "What memory changed".
changes:
  substituted: "{new} took the place of {old} (year {year})"
  fused: "{n} other events fused into it"
  actors_lost: "no longer remembered among its actors: {names}"
  year_lost: "the exact year, now a span of {span} years"
  place_region: "the exact place, now a region"
  place_none: "the place"
  size_lost: "the exact size"
  none: "nothing"
