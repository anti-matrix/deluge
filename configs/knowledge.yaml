# Knowledge graph (spec section 7). Data, not code: techniques, prerequisites, how often
# each is invented relative to the others, when it counts as used (unused techniques
# decay and can be forgotten), and its numeric effects.
#
# used_with: forage | herd | farm (the settlement gives that mode at least
#   knowledge.use_share of its people), size (population >= knowledge.size_use_population),
#   coast (the settlement's cell is on the coast), always.
# A held technique is latent where it cannot be used at all: coast techniques away from
#   the coast, herd and farm techniques on cells with no capacity for that mode. Latent
#   techniques decay at knowledge.decay_latent (none while a neighbour practises them).
#   Size-tied techniques are usable anywhere; small groups simply do not use them.
# label: how the chronicle names the technique.
# resources: minerals (world.minerals.types) the settlement needs access to, all of them, to
#   invent, adopt or use the technique (spec section 5). Until polities (Round 5) and trade
#   exist, access means a deposit of each mineral within world.minerals.access_radius_cells
#   of the settlement's cell (each mineral on its own: copper and tin need not share a cell).
#   Without access a held technique is latent.
# unlocks: the subsistence mode a technique makes available ("" for none).
# effects (multipliers unless noted; techniques without a mechanic yet keep their numbers
#   for later rounds):
#   farm_yield, herd_yield         capacity multiplier for that mode
#   river_farm_yield               farm capacity multiplier on river cells
#   production                     multiplier on all food production
#   production_min_population      production bonus applies only at this size and up
#   store_cap_years                store cap (years of food), replaces the forager value
#   spoilage                       multiplier on spoilage
#   drought_loss                   multiplier on the share of rain a drought takes from farming
#   migration_radius               hex steps added to the migration search radius
#   sea_steps                      sea cells a migration may cross
#   diffusion                      multiplier on the chance of adopting techniques from neighbours
#   famine_mortality               multiplier on famine deaths
#   town_cap, defense, military, monuments, memory_capacity, admin_cap, raid_range, trade_range:
#     later rounds
# Late techniques (after iron): effect sizes are uncalibrated placeholders (Round 4b).

