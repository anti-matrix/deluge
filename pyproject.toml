[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deluge"
version = "0.0.1"
description = "Deluge: civilization neuroevolution sim over 12,900 years after a global catastrophe"
requires-python = ">=3.12"
dependencies = [
    "mesa[rec]>=3.0,<4",
    "numpy",
    "opensimplex",
    "scipy",
    "pyarrow",
    "pandas",
    "pyyaml",
    "matplotlib",
    # Round 11: JIT for the reach and war-candidate kernels (deluge/systems/war.py); without it
    # the same kernels run as plain Python, very slowly.
    "numba>=0.68",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "hypothesis",
]
# Installed in round 12 for the real-topography importer.
earth = [
    "rasterio",
    "xarray",
]

[tool.setuptools.packages.find]
include = ["deluge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast suite by default, in parallel: -n auto means cores - 1 workers (tests/conftest.py).
addopts = "-ra -m 'not slow' -n auto"
markers = ["slow: more than 500 simulated years, more than one seed, or a full-size world; run with pytest -m slow"]
